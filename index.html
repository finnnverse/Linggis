const GAP=[0,1,2,4,7,14];
function renderKartu(){
  const due=dueCards(),n=learned();
  V().innerHTML=`
  <div class="pagehead"><span class="eyebrow">Pengulangan berjarak</span><h1 class="h-page">Kartu kata</h1>
  <p class="lede">Kata yang sudah lulus muncul lagi tepat sebelum kamu lupa. Jawab <b>Lupa</b>, kartu kembali besok. Jawab <b>Hafal</b>, jaraknya memanjang: 1, 2, 4, 7, lalu 14 hari.</p></div>
  <div id="rev"></div>
  <section><h2 class="h-sec">Kamus kamu <span class="count">${n} kata</span></h2>
  ${n?`<input class="search" id="q" type="search" placeholder="Cari kata Inggris atau artinya" aria-label="Cari kata"><div class="wlist" id="dict" style="margin-top:10px"></div>`:`<p class="lede">Belum ada kata. Buka ${PER_DAY} kata pertama di halaman <a href="#hari-ini">Hari Ini</a>.</p>`}
  </section>`;
  const rev=$('#rev');
  if(n&&!due.length){
    rev.innerHTML=`<div class="panel"><span class="eyebrow">Beres</span><h2>Tidak ada kartu jatuh tempo.</h2><p class="lede">Kartu berikutnya muncul ${fmt(Object.values(S.cards).map(c=>c.due).sort()[0])}.</p><div class="row"><button class="btn" id="free">Latihan semua kata</button></div></div>`;
    $('#free').onclick=()=>study(rev,shuffle(Object.keys(S.cards).map(Number)),{title:'Latihan bebas',endLabel:'Selesai',onEnd:renderKartu,cancel:renderKartu});
  }else if(n){
    rev.innerHTML=`<div class="panel em"><span class="eyebrow">Jatuh tempo hari ini</span><h2>${due.length} kartu perlu diulang</h2><div class="row"><button class="btn pri" id="startrev">Mulai ulang kartu ${I.arrow}</button></div></div>`;
    $('#startrev').onclick=()=>review(rev,shuffle(due));
  }
  if(n){const q=$('#q'),draw=()=>{const s=q.value.trim().toLowerCase();
    $('#dict').innerHTML=Object.keys(S.cards).map(Number).map(id=>VOCAB[id]).filter(v=>!s||v.w.toLowerCase().includes(s)||v.a.toLowerCase().includes(s)).map(v=>{const bx=S.cards[v.id].box;
      return wrow(v,`<br><span class="boxes" title="Tingkat hafal ${bx} dari 5">${[1,2,3,4,5].map(k=>`<i class="${k<=bx?'on':''}"></i>`).join('')}</span>`)}).join('')||'<p class="lede" style="padding:10px 0">Tidak ketemu.</p>'};
    q.oninput=draw;draw()}
}
function review(host,ids){
  let i=0;const t=today();
  (function r(){
    if(i>=ids.length){touch();host.innerHTML=`<div class="panel"><div class="result"><span class="eyebrow">Selesai</span><div class="big good">${ids.length}</div><p class="lede">kartu sudah diulang hari ini.</p><button class="btn pri" id="ok">Kembali</button></div></div>`;$('#ok').onclick=renderKartu;return}
    const v=VOCAB[ids[i]];
    host.innerHTML=`<div class="panel">
      <div class="qhead"><span class="eyebrow">Ulang kartu</span><span class="count">${i+1} / ${ids.length}</span></div>
      <div class="bar-p"><span style="width:${i/ids.length*100}%"></span></div>
      ${cardHTML(v)}
      <p class="lede" id="ask" style="text-align:center">Ingat artinya? Balik kartu untuk cek.</p>
      <div class="grade" id="grade" hidden><button class="btn g-bad" data-g="0">Lupa</button><button class="btn g-mid" data-g="1">Ragu</button><button class="btn g-ok" data-g="2">Hafal</button></div>
    </div>`;
    wireFlip(host,()=>{$('#grade').hidden=false;$('#ask').hidden=true});
    host.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g,c=S.cards[v.id];
      if(g===0)c.box=1;else if(g===2)c.box=Math.min(5,c.box+1);
      c.due=addDays(t,g===0?1:GAP[c.box]);save();i++;r();
    });
  })();
}

function materiHead(sub){
  const tabs=[['grammar','Grammar',cnt(S.chapters),CH.length],['percakapan','Percakapan',cnt(S.dialogs),DIALOGS.length],['cerita','Baca & Dengar',cnt(S.stories),STORIES.length]];
  return`<div class="pagehead"><span class="eyebrow">Materi</span><h1 class="h-page">${sub==='grammar'?'Grammar':sub==='percakapan'?'Percakapan':'Baca & dengar'}</h1></div>
  <div><div class="seg">${tabs.map(t=>`<a href="#${t[0]}" class="${t[0]===sub?'on':''}">${t[1]} <span class="count">${t[2]}/${t[3]}</span></a>`).join('')}</div></div>`}
const itemCard=(href,n,done,title,sub,lvl)=>`<a class="item ${done?'done':''}" href="${href}"><span class="n">${done?I.check:pad(n)}</span><span class="t"><b>${esc(title)}</b><span class="d">${esc(sub)}</span><span class="lvl">${lvl}</span></span></a>`;
function contentQuiz(host,item,store,label,nextHref,nextLabel){
  const start=()=>{quiz(host,mixQ(item.q),{title:label,onDone:(wrong,total)=>{
    const ok=!wrong.length;
    if(ok){if(!S[store][item.id])S[store][item.id]=today();touch()}
    host.innerHTML=resultHTML(ok,total-wrong.length,total,ok?'Tercentang di Peta Belajar.':'Baca atau dengarkan lagi bagian yang terlewat, lalu coba lagi.',
      (ok?(nextHref?`<a class="btn pri" href="${nextHref}">${esc(nextLabel)} ${I.arrow}</a>`:''):'<button class="btn pri" id="cq-again">Ulangi kuis</button>')+'<a class="btn" href="#hari-ini">Ke Hari Ini</a>');
    const a=host.querySelector('#cq-again');if(a)a.onclick=start;goTop(host);
  }});goTop(host)};
  host.innerHTML=`<div class="panel"><span class="eyebrow">Cek pemahaman</span><h2>${item.q.length} soal, harus benar semua</h2><div class="row"><button class="btn pri" id="cq-start">Mulai kuis</button></div></div>`;
  host.querySelector('#cq-start').onclick=start;
}

    $('#story').querySelectorAll('[data-s]').forEach(x=>{const go=()=>speakSeq([{t:sent[+x.dataset.s],el:x}]);x.onclick=go;x.onkeydown=e=>{if(e.key==='Enter')go()}});
  };
  draw();
  $('#tx').onchange=e=>{showText=e.target.checked;draw()};
  $('#tr').onchange=e=>{showTr=e.target.checked;draw()};
  if($('#playall')){$('#playall').onclick=()=>speakSeq(sent.map((t,i)=>({t,el:$('#story').querySelector(`[data-s="${i}"]`)})));$('#stop').onclick=stopSpeak}
  contentQuiz($('#cq'),s,'stories','Kuis: '+s.t,nx?'#cerita-'+nx.id:'',nx?'Cerita berikutnya':'');
}

/* =========================================================
   LATIHAN: tulis, dikte, susun, ucap
   ========================================================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false;
function lcsRatio(target,heard){const a=norm(target).split(' '),b=norm(heard).split(' ');const dp=a.map(()=>b.map(()=>0));
  for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)dp[i][j]=a[i]===b[j]?((i&&j)?dp[i-1][j-1]:0)+1:Math.max(i?dp[i-1][j]:0,j?dp[i][j-1]:0);
  return dp[a.length-1][b.length-1]/a.length}
function practicePool(n,sentenceMode){
  let ids=Object.keys(S.cards).map(Number);if(ids.length<8)ids=VOCAB.slice(0,30).map(v=>v.id);
  let vs=shuffle(ids).map(id=>VOCAB[id]);
  if(sentenceMode){const ok=v=>{const k=v.ex.split(' ').length;return !/["“”]/.test(v.ex)&&k>=3&&k<=9};const f=vs.filter(ok);vs=f.length>=4?f:shuffle(VOCAB.slice(0,60)).filter(ok)}
  return vs.slice(0,n);
}
const fbBox=(ok,html)=>`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Benar.':'Belum tepat.'}</b> ${html}</div>`;
const nextBtn=`<div class="row"><button class="btn pri" id="pnext">Lanjut ${I.arrow}</button></div>`;
const MODES={
  tulis:{t:'Tulis kata',d:'Lihat arti, ketik kata Inggrisnya. Melatih ejaan dan ingatan aktif.',ic:'pen',
    render(el,v,done){
      el.innerHTML=`<span class="eyebrow">Bahasa Inggrisnya?</span><p class="big-id">${esc(v.a)}</p>
        <input class="field" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ketik di sini" aria-label="Jawaban">
        <div class="row" id="pact"><button class="btn pri" id="pcheck">Cek</button></div><div id="pfb"></div>`;
      const inp=el.querySelector('#pin');
      const check=()=>{if(inp.disabled)return;const ok=norm(inp.value)===norm(v.w);inp.disabled=true;el.querySelector('#pact').hidden=true;speak(v.w);
        el.querySelector('#pfb').innerHTML=fbBox(ok,`<span class="en"><b>${esc(v.w)}</b></span> /${esc(v.b)}/ · <span class="en">${esc(v.ex)}</span>`)+nextBtn;
        el.querySelector('#pnext').onclick=()=>done(ok);el.querySelector('#pnext').focus({preventScroll:true})};
      el.querySelector('#pcheck').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    }},
  dikte:{t:'Dikte',d:'Dengar satu kalimat, lalu ketik persis yang kamu dengar. Latihan telinga terbaik.',ic:'ear',
    render(el,v,done){
      el.innerHTML=`<span class="eyebrow">Ketik kalimat yang kamu dengar</span>
        <div class="row"><button class="btn" id="pplay">${I.play} Putar</button><button class="btn" id="pslow">Putar pelan</button></div>
        <input class="field" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ketik kalimatnya" aria-label="Jawaban">
        <div class="row" id="pact"><button class="btn pri" id="pcheck">Cek</button></div><div id="pfb"></div>`;
      const inp=el.querySelector('#pin');speak(v.ex);
      el.querySelector('#pplay').onclick=()=>speak(v.ex);el.querySelector('#pslow').onclick=()=>speak(v.ex,.6);
      const check=()=>{if(inp.disabled)return;const ok=norm(inp.value)===norm(v.ex);inp.disabled=true;el.querySelector('#pact').hidden=true;
        el.querySelector('#pfb').innerHTML=fbBox(ok,`<span class="en">${esc(v.ex)}</span><br>${esc(v.exa)}`)+nextBtn;
        el.querySelector('#pnext').onclick=()=>done(ok);el.querySelector('#pnext').focus({preventScroll:true})};
      el.querySelector('#pcheck').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    }},
  susun:{t:'Susun kalimat',d:'Urutkan kata menjadi kalimat yang benar. Melatih pola grammar tanpa menghafal rumus.',ic:'puzzle',
    render(el,v,done){
      const words=v.ex.split(' ');let bank=shuffle(words.map((w,i)=>({w,i})));if(bank.map(x=>x.i).join()===words.map((_,i)=>i).join())bank.reverse();
      let ans=[],locked=false;
      el.innerHTML=`<span class="eyebrow">Susun dalam bahasa Inggris</span><p class="big-id">${esc(v.exa)}</p>
        <div class="slots" id="slots" aria-label="Jawabanmu"></div><div class="bank" id="bank"></div>
        <div class="row" id="pact"><button class="btn pri" id="pcheck" disabled>Cek</button></div><div id="pfb"></div>`;
      const draw=()=>{
        el.querySelector('#slots').innerHTML=ans.map((x,k)=>`<button class="tok" data-a="${k}">${esc(x.w)}</button>`).join('');
        el.querySelector('#bank').innerHTML=bank.map((x,k)=>`<button class="tok" data-b="${k}">${esc(x.w)}</button>`).join('');
        el.querySelector('#pcheck').disabled=bank.length>0;
        if(locked)return;
        el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ans.push(bank.splice(+b.dataset.b,1)[0]);draw()});
        el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{bank.push(ans.splice(+b.dataset.a,1)[0]);draw()});
      };
      draw();
      el.querySelector('#pcheck').onclick=()=>{locked=true;draw();const ok=ans.map(x=>x.w).join(' ')===v.ex;el.querySelector('#pact').hidden=true;speak(v.ex);
        el.querySelector('#pfb').innerHTML=fbBox(ok,`<span class="en">${esc(v.ex)}</span>`)+nextBtn;el.querySelector('#pnext').onclick=()=>done(ok)};
    }},
  ucap:{t:'Tes ucapan',d:'Baca kalimat dengan suara keras. Mikrofon mengecek apakah ucapanmu bisa dikenali.',ic:'mic',
    render(el,v,done){
      const self=()=>{el.querySelector('#pzone').innerHTML=`<p class="note info">Mikrofon tidak tersedia di sini, jadi kamu yang menilai sendiri. Dengar contohnya, ucapkan keras-keras tiga kali, lalu nilai dengan jujur.</p>
        <div class="row"><button class="btn g-ok" id="sok">Sudah mirip</button><button class="btn g-bad" id="sno">Masih susah</button></div>`;
        el.querySelector('#sok').onclick=()=>done(true);el.querySelector('#sno').onclick=()=>done(false)};
      el.innerHTML=`<span class="eyebrow">Ucapkan dengan suara keras</span><p class="big-en">${esc(v.ex)}</p><p class="lede">${esc(v.exa)}</p>
        <div class="row">${spk(v.ex,'Dengar contoh')}</div><div id="pzone" style="display:flex;flex-direction:column;gap:14px"></div>`;
      if(!SR||micBlocked){self();return}
      const zone=el.querySelector('#pzone');
      zone.innerHTML=`<button class="micbtn" id="mic" aria-label="Mulai bicara">${I.mic}</button><p class="lede" id="mstat" style="text-align:center">Ketuk mikrofon, lalu bicara.</p><div id="pfb"></div>`;
      const mic=zone.querySelector('#mic'),stat=zone.querySelector('#mstat');let rec=null;
      mic.onclick=()=>{
        if(rec){try{rec.stop()}catch(e){}return}
        stopSpeak();
        try{rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3}catch(e){micBlocked=true;self();return}
        mic.classList.add('live');stat.textContent='Mendengarkan...';
        rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);let best=alts[0],score=0;alts.forEach(a=>{const r=lcsRatio(v.ex,a);if(r>=score){score=r;best=a}});
          const ok=score>=.8;
          zone.querySelector('#pfb').innerHTML=fbBox(ok,`Terdengar: <span class="en">"${esc(best)}"</span> · cocok ${Math.round(score*100)}%${ok?'':'. Dengar contohnya lagi, lalu coba ulang.'}`)+
            `<div class="row">${ok?'':'<button class="btn" id="pskip">Lewati</button>'}<button class="btn pri" id="pnext">${ok?'Lanjut':'Lanjut (dihitung salah)'} ${I.arrow}</button></div>`;
          zone.querySelector('#pnext').onclick=()=>done(ok);const sk=zone.querySelector('#pskip');if(sk)sk.onclick=()=>{zone.querySelector('#pfb').innerHTML='';stat.textContent='Ketuk mikrofon, lalu coba lagi.'}};
        rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micBlocked=true;self()}else stat.textContent=e.error==='no-speech'?'Tidak terdengar suara. Coba lagi.':'Gagal mendengar. Coba lagi.'};
        rec.onend=()=>{rec=null;mic.classList.remove('live');if(stat.textContent==='Mendengarkan...')stat.textContent='Ketuk mikrofon, lalu bicara.'};
        try{rec.start()}catch(e){micBlocked=true;self()}
      };
    }}
};
function renderLatihan(){
  const n=learned();
  V().innerHTML=`<div class="pagehead"><span class="eyebrow">Latihan aktif</span><h1 class="h-page">Pakai, jangan cuma hafal</h1>
    <p class="lede">Empat latihan ini memaksa kamu <b>mengeluarkan</b> bahasa Inggris: menulis, mendengar, menyusun, dan berbicara. Bahannya diambil dari ${n>=8?'kata yang sudah kamu pelajari':'kata-kata dasar (akan mengikuti kata yang kamu pelajari)'}.</p></div>
    <div id="prac"><div class="modes">${Object.keys(MODES).map(k=>{const m=MODES[k];return`<button class="mode" data-mode="${k}"><span class="ico">${I[m.ic]}</span><b>${m.t}</b><span>${m.d}</span><small>${S.practice[k]||0} sesi selesai</small></button>`}).join('')}</div></div>
    <p class="note info">Tips: lakukan satu sesi (8 soal) setiap hari setelah kata baru. Tes ucapan memakai mikrofon browser, paling stabil di Chrome.</p>`;
  V().querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>runPractice(b.dataset.mode));
}
function runPractice(mode){
  const host=$('#prac'),M=MODES[mode],items=practicePool(8,mode!=='tulis');let i=0,score=0;
  (function step(){
    if(i>=items.length){S.practice[mode]=(S.practice[mode]||0)+1;touch();const ok=score>=items.length*.75;
      host.innerHTML=`<div class="panel"><div class="result"><span class="eyebrow">${M.t} selesai</span><div class="big ${ok?'good':'bad'}">${score}/${items.length}</div><p class="lede">${ok?'Bagus. Besok ulangi dengan mode lain.':'Tidak apa-apa. Ulangi sekali lagi, biasanya langsung naik.'}</p></div><div class="row c"><button class="btn pri" id="again">Sesi baru</button><button class="btn" id="modes">Pilih latihan lain</button></div></div>`;
      $('#again').onclick=()=>runPractice(mode);$('#modes').onclick=renderLatihan;goTop(host);return}
    host.innerHTML=`<div class="panel"><div class="qhead"><span class="eyebrow">${M.t}</span><span class="count">${i+1} / ${items.length}</span></div>
      <div class="bar-p"><span style="width:${i/items.length*100}%"></span></div><div id="pbody" style="display:flex;flex-direction:column;gap:14px"></div>
      <button class="btn ghost sm" id="pquit" style="align-self:flex-start">Keluar</button></div>`;
    $('#pquit').onclick=()=>{stopSpeak();renderLatihan()};
    M.render($('#pbody'),items[i],ok=>{if(ok)score++;i++;step()});
    const inp=host.querySelector('#pin');if(inp)inp.focus({preventScroll:true});
  })();
  goTop(host);
}

/* =========================================================
   PETA + pengaturan
   ========================================================= */
function renderPeta(){
  const n=learned();let curSet=false;
  const items=STAGES.map(s=>{
    const done=stageDone(s),wOk=n>=s.words;let cls=done?'done':'';if(!done&&!curSet){cls='cur';curSet=true}
    const row=(ok,html)=>`<div class="${ok?'ok':''}"><span class="box">${ok?'✓':''}</span>${html}</div>`;
    return`<li class="stage ${cls}"><span class="dot">${done?'✓':s.n}</span>
      <h3>${esc(s.t)} <span class="lvl">${s.lvl}</span></h3><p>${esc(s.d)}</p>
      <div class="todo">
        ${s.ch.map(id=>row(S.chapters[id],`<a href="#bab-${id}">Grammar: ${esc(CH.find(x=>x.id===id).t)}</a>`)).join('')}
        ${s.dl.map(id=>row(S.dialogs[id],`<a href="#dialog-${id}">Percakapan: ${esc(DIALOGS.find(x=>x.id===id).t)}</a>`)).join('')}
        ${s.st.map(id=>row(S.stories[id],`<a href="#cerita-${id}">Cerita: ${esc(STORIES.find(x=>x.id===id).t)}</a>`)).join('')}
        ${row(wOk,`<span>Lulus ${s.words} kata</span><span class="meter"><span style="width:${Math.min(100,n/s.words*100)}%"></span></span><span class="count">${Math.min(n,s.words)}/${s.words}</span>`)}
      </div></li>`}).join('');
  V().innerHTML=`<div class="pagehead"><span class="eyebrow">Dari nol sampai lancar · level kamu ${level()}</span><h1 class="h-page">Peta belajar</h1>
    <p class="lede">Tujuh tahap, dari yang paling dasar. A0 sampai B1+ adalah level standar internasional (CEFR). Tahap tercentang otomatis saat semua isinya lulus.</p></div>
    <ol class="path">${items}</ol>
    <details class="box"><summary>Pindah perangkat atau hapus progres</summary>
      <div class="settings">
        <p class="lede">Progres tersimpan di browser perangkat ini. Untuk pindah ke HP atau laptop lain, salin kodenya lalu muat di sana.</p>
        <div class="row"><button class="btn sm" id="exp">Salin kode progres</button><span id="exp-msg" class="count"></span></div>
        <textarea class="code" id="exp-box" readonly hidden aria-label="Kode progres"></textarea>
        <textarea class="code" id="imp-box" placeholder="Tempel kode progres dari perangkat lain" aria-label="Tempel kode progres"></textarea>
        <div class="row"><button class="btn sm" id="imp">Muat progres</button><span id="imp-msg" class="count"></span></div>
        <div class="row"><button class="btn sm" id="reset">Hapus semua progres</button><span id="reset-confirm" hidden>Yakin? Semua kembali dari awal. <button class="btn sm" id="reset-yes">Ya, hapus</button> <button class="btn sm ghost" id="reset-no">Batal</button></span></div>
      </div></details>`;
  $('#exp').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S)))),box=$('#exp-box');box.value=code;box.hidden=false;
    const fb=()=>{box.select();$('#exp-msg').textContent='Salin kode di kotak ini.'};
    try{navigator.clipboard.writeText(code).then(()=>{$('#exp-msg').textContent='Tersalin.'},fb)}catch(e){fb()}};
  $('#imp').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp-box').value.trim()))));if(!o||!Array.isArray(o.batches))throw 0;S=Object.assign(blank(),o);save();renderPeta();$('#imp-msg').textContent='Progres dimuat.'}
    catch(e){$('#imp-msg').textContent='Kode tidak bisa dibaca. Pastikan tersalin utuh.'}};
  $('#reset').onclick=()=>{$('#reset-confirm').hidden=false};
  $('#reset-no').onclick=()=>{$('#reset-confirm').hidden=true};
  $('#reset-yes').onclick=()=>{S=blank();save();location.hash='hari-ini';route()};
}

/* =========================================================
   ROUTER
   ========================================================= */
function route(){
  const h=(location.hash||'').slice(1)||'hari-ini';let v=h,num=null;const m=h.match(/^(bab|dialog|cerita)-(\d+)$/);
  if(m){num=+m[2];v=m[1]==='bab'?'grammar':m[1]==='dialog'?'percakapan':'cerita'}
  if(!['hari-ini','kartu','grammar','percakapan','cerita','latihan','peta'].includes(v))v='hari-ini';
  const tab=['grammar','percakapan','cerita'].includes(v)?'materi':v;
  stopSpeak();
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  ({'hari-ini':renderToday,kartu:renderKartu,grammar:()=>renderGrammar(num),percakapan:()=>renderDialogs(num),cerita:()=>renderStories(num),latihan:renderLatihan,peta:renderPeta})[v]();
  const el=V();el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');
  chipStreak();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>

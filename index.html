<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inggris Dari Nol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: app shell. Kolom baca 720px, tab bar di bawah (HP) / di header (desktop).
   Bahasa Inggris selalu serif + stabilo kuning; antarmuka Indonesia sans. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --sunk:#ECEEF6; --ink:#141A38; --muted:#5A6285; --line:#DADEEC;
  --accent:#2D43DB; --accent-ink:#FFFFFF; --accent-soft:#E3E7FC;
  --mark:#FFDF3D; --mark-ink:#141A38; --mark-band:#FFE566;
  --hero:#141A38; --hero-ink:#F5F6FB; --hero-muted:#A9B0D6; --hero-line:#2C3566;
  --good:#1C7C4E; --good-soft:#DFF3E7; --bad:#B93A2B; --bad-soft:#FBE5E1; --warn:#8F5E00; --warn-soft:#FFF1CC;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-en:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F24; --surface:#141936; --sunk:#1B2147; --ink:#ECEEFB; --muted:#9BA3C9; --line:#293061;
  --accent:#8E9DFF; --accent-ink:#0B0F24; --accent-soft:#222A5C;
  --mark:#FFD94A; --mark-ink:#141A38; --mark-band:rgba(255,217,74,.34);
  --hero:#1B2147; --hero-ink:#ECEEFB; --hero-muted:#9BA3C9; --hero-line:#333C78;
  --good:#6FD09A; --good-soft:#15382A; --bad:#F3907E; --bad-soft:#3D1F1B; --warn:#EDBE5E; --warn-soft:#3B2E12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F24; --surface:#141936; --sunk:#1B2147; --ink:#ECEEFB; --muted:#9BA3C9; --line:#293061;
  --accent:#8E9DFF; --accent-ink:#0B0F24; --accent-soft:#222A5C;
  --mark:#FFD94A; --mark-ink:#141A38; --mark-band:rgba(255,217,74,.34);
  --hero:#1B2147; --hero-ink:#ECEEFB; --hero-muted:#9BA3C9; --hero-line:#333C78;
  --good:#6FD09A; --good-soft:#15382A; --bad:#F3907E; --bad-soft:#3D1F1B; --warn:#EDBE5E; --warn-soft:#3B2E12;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.02em;font-weight:800}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.en{font-family:var(--f-en);letter-spacing:-.005em}
.hl{background:linear-gradient(transparent 56%,var(--mark-band) 56%);padding:0 .1em;border-radius:2px}
.wrap{max-width:752px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* ---------- header & nav ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;max-width:980px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{background:var(--mark);color:var(--mark-ink);padding:1px 7px;border-radius:6px;margin-left:2px;display:inline-block;transform:rotate(-2deg)}
.streak{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.streak .ic{color:var(--warn)}
.streak.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.streak.on .ic{color:var(--mark-ink)}
nav.tabs{display:flex;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14.5px;padding:8px 12px;border-radius:10px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--mark)}
@media (min-width:821px){nav.tabs{margin-left:18px}}
@media (max-width:820px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));justify-content:space-around;gap:0}
  nav.tabs a{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;min-width:0}
  nav.tabs a .ic{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:transparent;box-shadow:none;color:var(--ink)}
  nav.tabs a[aria-current="page"] b{background:linear-gradient(transparent 50%,var(--mark-band) 50%)}
  main{padding-bottom:104px!important}
}
nav.tabs a b{font-weight:700;padding:0 3px}

main{padding-block:22px 64px;display:flex;flex-direction:column;gap:26px}
main>*{min-width:0}
.enter{animation:rise .32s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.h-page{font-size:clamp(30px,6.4vw,44px)}
.h-sec{font-size:20px;margin-bottom:12px}
.pagehead{display:flex;flex-direction:column;gap:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15.5px;text-decoration:none;color:var(--ink);line-height:1.2;transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;cursor:pointer;line-height:1.2}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk.bare{border:0;background:transparent;padding:4px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}

/* ---------- hero (Hari Ini) ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-muted)}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.lvl-chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero h1{font-size:clamp(30px,7.4vw,46px);max-width:16ch}
.hero h1 mark{background:none;color:var(--mark)}
.hero p{color:var(--hero-muted);max-width:46ch}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;border-top:1px solid var(--hero-line);padding-top:14px;margin-top:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--hero-muted)}
.week i{width:100%;max-width:44px;height:8px;border-radius:99px;background:var(--hero-line)}
.week .on i{background:var(--mark)}
.week .today{color:var(--hero-ink);font-weight:500}
.week .today i{outline:2px solid var(--hero-ink);outline-offset:2px}

/* ---------- plan ---------- */
.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plan li+li{border-top:1px solid var(--line)}
.plan a,.plan button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;background:none;border:0;text-align:left;text-decoration:none;color:inherit;cursor:pointer}
.plan a:hover,.plan button:hover{background:var(--sunk)}
.plan .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid var(--line);flex:none;color:var(--muted)}
.plan .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.plan .tx b{font-size:16px;line-height:1.3}
.plan .tx em{font-style:normal;font-size:14px;color:var(--muted);line-height:1.35}
.plan .go{color:var(--muted)}
.plan .s-ok .num{background:var(--good);border-color:var(--good);color:var(--surface)}
.plan .s-ok .tx b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.plan .s-now .num{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:500}
.plan .s-lock{opacity:.55}

/* ---------- panel / task ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.panel.em{border:2px solid var(--ink)}
.panel.warn{border:2px solid var(--warn)}
.panel h2{font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-en);font-size:16px;padding:2px 10px;border-radius:8px;background:var(--sunk)}
.note{font-size:14.5px;padding:10px 14px;border-radius:12px;background:var(--warn-soft)}
.note.good{background:var(--good-soft)} .note.bad{background:var(--bad-soft)} .note.info{background:var(--accent-soft)}

.wlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wlist>div{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wlist .w{font-family:var(--f-en);font-size:19px;font-weight:600;line-height:1.25}
.wlist .w small{display:block;font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:12px}
.wlist .m{color:var(--muted);font-size:15px;line-height:1.35}
.boxes{display:inline-flex;gap:3px;margin-top:4px}
.boxes i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--accent)}

/* ---------- flashcard ---------- */
.flip{perspective:1400px;cursor:pointer;border-radius:22px}
.flip-in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:300px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:44px 20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;position:relative;box-shadow:0 10px 30px -18px rgba(20,26,56,.35)}
.face.backf{transform:rotateY(180deg);background:var(--surface)}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip:not(.on) .backf,.flip.on .front{pointer-events:none}
.face .tag{position:absolute;top:14px;left:16px}
.face .word{font-size:clamp(40px,11vw,62px);font-weight:600;line-height:1.02;word-break:break-word}
.face .word.sm{font-size:clamp(26px,7vw,34px)}
.face .say{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.face .mean{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.face .ex{font-size:20px;line-height:1.4;max-width:30ch}
.face .exa{color:var(--muted);font-size:15px;max-width:36ch}
.face .hint{font-size:13px;color:var(--muted);margin-top:8px}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:13px 6px}
.g-bad{background:var(--bad-soft);border-color:var(--bad-soft)} .g-mid{background:var(--warn-soft);border-color:var(--warn-soft)} .g-ok{background:var(--good-soft);border-color:var(--good-soft)}

/* ---------- quiz ---------- */
.bar-p{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar-p span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-prompt{font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.015em}
.q-prompt q{font-family:var(--f-en);font-weight:600;quotes:none;background:linear-gradient(transparent 56%,var(--mark-band) 56%);padding:0 .12em}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16.5px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{font-size:15px;padding:12px 14px;border-radius:12px;line-height:1.5}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb .en{font-size:18px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding-block:8px}
.result .big{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.04em;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.result .big.good{color:var(--good)} .result .big.bad{color:var(--bad)}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}

/* ---------- kata hari ini & stats ---------- */
.wod{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.wod .word{font-size:clamp(34px,9vw,48px);font-weight:600;line-height:1.05}
.wod .mean{font-weight:800;font-size:18px}
.wod .ex{font-size:19px;line-height:1.4}
.wod .exa{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.stat b small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.stat span{font-size:13px;color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- lists (materi) ---------- */
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg a,.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,56,.12)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;flex:none}
.item.done .n{background:var(--good);color:var(--surface)}
.item .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.item b{font-size:16px;line-height:1.3}
.item .d{font-size:13.5px;color:var(--muted);line-height:1.4}
.lvl{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);letter-spacing:.04em;align-self:flex-start;margin-top:4px}

/* ---------- prose (grammar) ---------- */
.prose{display:flex;flex-direction:column;gap:14px;max-width:66ch;font-size:17px}
.prose h3{font-size:19px;margin-top:8px}
.formula{font-family:var(--f-mono);font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mark);padding:14px 16px;border-radius:0 12px 12px 0;line-height:1.85;overflow-x:auto}
.formula b{color:var(--accent);font-weight:500}
.tblwrap{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.mini th{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.tip{font-size:15px;background:var(--warn-soft);padding:12px 14px;border-radius:12px}
.exlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.exlist>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.exlist p.en{font-size:19px;line-height:1.35;font-weight:500}
.exlist p.id{font-size:14.5px;color:var(--muted)}

/* ---------- audio toolbar, dialog, story ---------- */
.toolbar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tog{display:inline-flex;gap:7px;align-items:center;font-size:14.5px;cursor:pointer;font-weight:500}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.rate{display:inline-flex;align-items:center;gap:6px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13.5px;font-weight:700}
.rate button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dialog{display:flex;flex-direction:column;gap:14px}
.line{display:flex;flex-direction:column;gap:4px;max-width:90%}
.line.a{align-self:flex-start} .line.b{align-self:flex-end;align-items:flex-end}
.line .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bubble{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.bubble>div{min-width:0}
.line.a .bubble{border-top-left-radius:4px}
.line.b .bubble{background:var(--accent-soft);border-color:transparent;border-top-right-radius:4px}
.bubble .en{font-size:19px;line-height:1.4}
.bubble .tr{font-size:14.5px;color:var(--muted);margin-top:3px}
.reveal{border:2px dashed var(--accent);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-weight:700;font-size:14.5px;line-height:1.45}
.reveal span{display:block;font-weight:400;color:var(--muted)}
.playing .bubble{outline:2.5px solid var(--mark)}
.story{display:flex;flex-direction:column;gap:16px;max-width:64ch}
.story .en{font-size:21px;line-height:1.75}
.story .tr{font-size:15.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:14px}
.sent{cursor:pointer;border-radius:3px;transition:background .2s}
.sent:hover{background:var(--sunk)}
.sent.playing{background:var(--mark-band)}
.hidden-text{padding:18px;border-radius:14px;background:var(--sunk);font-size:15.5px}

/* ---------- latihan ---------- */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;cursor:pointer;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode .ico{width:40px;height:40px;border-radius:12px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:18px}
.mode b{font-size:18px;letter-spacing:-.01em}
.mode span{font-size:14px;color:var(--muted);line-height:1.45}
.mode small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-en);font-size:20px}
.field:focus{outline:none;border-color:var(--accent)}
.big-id{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.big-en{font-family:var(--f-en);font-size:28px;line-height:1.3;font-weight:500}
.slots{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;border:2px dashed var(--line);align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.tok{font-family:var(--f-en);font-size:19px;padding:6px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.3}
.tok:hover{border-color:var(--accent)}
.slots .tok{background:var(--accent-soft);border-color:transparent}
.micbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;font-size:30px;align-self:center}
.micbtn.live{background:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,58,43,.45)}100%{box-shadow:0 0 0 18px rgba(185,58,43,0)}}

/* ---------- peta ---------- */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stage{position:relative;padding:0 0 26px 48px}
.stage::before{content:"";position:absolute;left:16px;top:36px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .dot{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;background:var(--surface);border:2px solid var(--line)}
.stage.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.stage.cur .dot{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:500}
.stage h3{font-size:21px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage h3 .lvl{margin:0;align-self:center}
.stage>p{color:var(--muted);margin:4px 0 12px;font-size:15px}
.todo{display:flex;flex-direction:column;gap:7px}
.todo>div{display:flex;gap:10px;align-items:center;font-size:15.5px;line-height:1.35}
.todo .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.todo .ok .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.todo a{color:inherit}
.todo .meter{flex:1;max-width:140px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea.code{width:100%;min-height:76px;font-family:var(--f-mono);font-size:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px}
.settings{display:flex;flex-direction:column;gap:12px}
details.box{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
details.box summary{cursor:pointer;font-weight:700}
details.box[open] summary{margin-bottom:12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
#task,#prac,#cq,#rev{scroll-margin-top:76px}
</style>

{id:1,lvl:'A0',t:'Alfabet & Cara Baca',s:'Kenapa tulisan dan bacaan beda',
body:`<p>Bahasa Inggris tidak dibaca seperti tulisannya. Huruf vokalnya punya nama yang berbeda dari bahasa Indonesia, dan ini sumber salah baca paling umum.</p>
<h3>Nama huruf vokal</h3>
<div class="tblwrap"><table class="mini"><tr><th>Huruf</th><th>Dibaca</th><th>Contoh kata</th></tr>
<tr><td>A</td><td>ei</td><td>name → neim</td></tr><tr><td>E</td><td>i</td><td>he → hi</td></tr><tr><td>I</td><td>ai</td><td>time → taim</td></tr><tr><td>O</td><td>ou</td><td>go → gou</td></tr><tr><td>U</td><td>yu</td><td>use → yuz</td></tr></table></div>
<h3>Pola yang sering muncul</h3>
<div class="formula">huruf vokal + konsonan + <b>e</b> di akhir → vokal dibaca seperti namanya<br>name (neim) · time (taim) · home (houm)<br><b>th</b> → lidah di antara gigi: think, three<br><b>ee / ea</b> → i panjang: see, eat</div>
<p class="tip">Setiap kartu vocab punya "cara baca" dan tombol dengar. Biasakan mengucapkan keras-keras, bukan cuma dibaca dalam hati.</p>`,
ex:[['name','neim'],['time','taim'],['three','thri'],['see','si']],
q:[{p:'Huruf <q>I</q> dalam alfabet Inggris dibaca…',o:['ai','i','ei','ou'],a:0,e:'Huruf I dibaca "ai", seperti di kata time (taim).'},
{p:'Kata <q>name</q> dibaca…',o:['neim','na-me','nem','nim'],a:0,e:'Vokal + konsonan + e di akhir: a dibaca "ei", jadi neim.'},
{p:'Huruf <q>E</q> dibaca…',o:['i','e','ei','ai'],a:0,e:'Huruf E dibaca "i", seperti di kata he (hi).'}]},
{id:2,lvl:'A0',t:'Kata Ganti (Pronoun)',s:'I, you, he, she, me, my',
body:`<p>Kata ganti dipakai supaya tidak mengulang nama. Bentuknya berubah tergantung posisinya di kalimat.</p>
<div class="tblwrap"><table class="mini"><tr><th>Pelaku</th><th>Objek</th><th>Milik</th><th>Arti</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>saya</td></tr><tr><td>you</td><td>you</td><td>your</td><td>kamu</td></tr><tr><td>he</td><td>him</td><td>his</td><td>dia (laki-laki)</td></tr><tr><td>she</td><td>her</td><td>her</td><td>dia (perempuan)</td></tr><tr><td>it</td><td>it</td><td>its</td><td>itu (benda/hewan)</td></tr><tr><td>we</td><td>us</td><td>our</td><td>kami / kita</td></tr><tr><td>they</td><td>them</td><td>their</td><td>mereka</td></tr></table></div>
<p class="tip">Bahasa Indonesia cuma punya "dia". Bahasa Inggris membedakan <b>he</b> (laki-laki) dan <b>she</b> (perempuan).</p>`,
ex:[['She is my sister.','Dia saudara perempuanku.'],['Call him.','Telepon dia (laki-laki).'],['This is our shop.','Ini toko kami.']],
q:[{p:'<q>___ is my mother.</q>',o:['She','Her','He','Him'],a:0,e:'Ibu itu perempuan dan menjadi pelaku, jadi pakai She.'},
{p:'<q>Please help ___.</q> (saya)',o:['me','I','my','mine'],a:0,e:'Setelah kata kerja (help), saya menjadi objek: me.'},
{p:'<q>This is ___ book.</q> (milik mereka)',o:['their','they','them','there'],a:0,e:'Kepemilikan mereka = their.'}]},
{id:3,lvl:'A1',t:'To Be: am / is / are',s:'Kata "adalah" dan "sedang berada"',
body:`<p>To be menghubungkan pelaku dengan keadaan, sifat, profesi, atau tempat. Dalam bahasa Indonesia sering tidak diterjemahkan.</p>
<div class="formula"><b>I</b> am<br><b>he / she / it</b> is<br><b>you / we / they</b> are<br><br>Negatif: I am <b>not</b> tired.<br>Tanya: <b>Are</b> you ready?</div>
<p class="tip">"Saya lapar" bukan "I hungry" tapi <b>I am hungry</b>. Kalimat Inggris hampir selalu butuh kata kerja.</p>`,
ex:[['I am tired.','Saya capek.'],['The shop is open.','Tokonya buka.'],['They are at home.','Mereka di rumah.'],['Is it expensive?','Apakah itu mahal?']],
q:[{p:'<q>She ___ a teacher.</q>',o:['is','am','are','be'],a:0,e:'She memakai is.'},
{p:'<q>We ___ busy today.</q>',o:['are','is','am','be'],a:0,e:'We memakai are.'},
{p:'Kalimat yang benar untuk "Saya lapar":',o:['I am hungry.','I hungry.','I is hungry.','Me hungry.'],a:0,e:'Butuh to be: I am hungry.'},
{p:'<q>___ you ready?</q>',o:['Are','Is','Am','Do'],a:0,e:'Pertanyaan dengan to be: to be pindah ke depan. You → Are.'}]},
{id:4,lvl:'A1',t:'A, An, The & Jamak',s:'Sebuah, itu, dan bentuk banyak',
body:`<p><b>a / an</b> berarti "sebuah/seorang" untuk satu benda yang belum spesifik. <b>the</b> untuk benda yang sudah jelas yang mana.</p>
<div class="formula"><b>a</b> + bunyi konsonan: a bag, a shop<br><b>an</b> + bunyi vokal: an egg, an item<br><b>the</b> + benda tertentu: the door (pintu yang itu)<br><br>Jamak: tambah <b>-s</b> → two bags<br>Akhiran s, sh, ch, x → <b>-es</b>: boxes<br>Tidak beraturan: child → children, man → men</div>`,
ex:[['I have a phone.','Saya punya (sebuah) HP.'],['I eat an egg.','Saya makan sebutir telur.'],['Close the door.','Tutup pintunya.'],['three bags','tiga tas']],
q:[{p:'<q>I want ___ egg.</q>',o:['an','a','the two','—'],a:0,e:'Egg diawali bunyi vokal, jadi an.'},
{p:'Bentuk jamak <q>child</q>:',o:['children','childs','childes','child'],a:0,e:'Child termasuk tidak beraturan: children.'},
{p:'<q>Please open ___ door.</q> (pintu yang di situ)',o:['the','a','an','—'],a:0,e:'Pintunya sudah jelas yang mana, pakai the.'}]},
{id:5,lvl:'A1',t:'Present Simple',s:'Kebiasaan dan fakta',
body:`<p>Dipakai untuk hal yang rutin, kebiasaan, atau fakta umum. Biasanya ada kata seperti every day, always, sometimes.</p>
<div class="formula">I / you / we / they + <b>kata kerja</b> → I work<br>he / she / it + kata kerja + <b>s/es</b> → she works<br><br>Negatif: I <b>don't</b> work · she <b>doesn't</b> work<br>Tanya: <b>Do</b> you work? · <b>Does</b> she work?</div>
<p class="tip">Setelah doesn't / does, kata kerja kembali polos: She doesn't <b>work</b> (bukan works).</p>`,
ex:[['I drink coffee every morning.','Saya minum kopi setiap pagi.'],['He works in a shop.','Dia bekerja di toko.'],['She doesn’t eat fish.','Dia tidak makan ikan.'],['Do you like tea?','Kamu suka teh?']],
q:[{p:'<q>My father ___ in Jakarta.</q>',o:['works','work','working','is work'],a:0,e:'He/she/it + s: works.'},
{p:'<q>They ___ like coffee.</q> (tidak)',o:['don’t','doesn’t','not','isn’t'],a:0,e:'They memakai don’t.'},
{p:'<q>___ she speak English?</q>',o:['Does','Do','Is','Are'],a:0,e:'She memakai does untuk bertanya.'},
{p:'<q>He doesn’t ___ meat.</q>',o:['eat','eats','eating','ate'],a:0,e:'Setelah doesn’t, kata kerja polos: eat.'}]},
{id:6,lvl:'A1',t:'Present Continuous',s:'Sedang terjadi sekarang',
body:`<p>Dipakai untuk kegiatan yang sedang berlangsung saat ini.</p>
<div class="formula">pelaku + <b>am / is / are</b> + kata kerja<b>-ing</b><br>I am eating · She is sleeping · They are working<br><br>Negatif: I am <b>not</b> working<br>Tanya: <b>Is</b> he sleeping?</div>
<p class="tip">Kata kerja berakhiran e, buang e-nya: make → making. Satu vokal + satu konsonan, gandakan: run → running.</p>`,
ex:[['I am cooking now.','Saya sedang masak sekarang.'],['She is talking to a customer.','Dia sedang bicara dengan pelanggan.'],['Are you waiting?','Kamu sedang menunggu?']],
q:[{p:'<q>Look! The child ___.</q>',o:['is sleeping','sleeps','sleep','are sleeping'],a:0,e:'Sedang terjadi: is + sleeping.'},
{p:'Bentuk -ing dari <q>make</q>:',o:['making','makeing','makking','maked'],a:0,e:'Buang e: making.'},
{p:'<q>We ___ for the bus.</q> (sedang menunggu)',o:['are waiting','is waiting','waiting','wait'],a:0,e:'We + are + waiting.'}]},
{id:7,lvl:'A1',t:'Membuat Pertanyaan',s:'What, where, when, do, does',
body:`<p>Pertanyaan bahasa Inggris punya urutan tetap. Kata tanya di depan, lalu kata bantu, lalu pelaku.</p>
<div class="formula"><b>Kata tanya</b> + do/does + pelaku + kata kerja?<br>Where <b>do</b> you live? · What <b>does</b> he want?<br><br><b>Kata tanya</b> + am/is/are + pelaku?<br>Where <b>is</b> the shop? · How <b>are</b> you?</div>
<div class="tblwrap"><table class="mini"><tr><th>Kata tanya</th><th>Arti</th></tr><tr><td>what</td><td>apa</td></tr><tr><td>who</td><td>siapa</td></tr><tr><td>where</td><td>di mana</td></tr><tr><td>when</td><td>kapan</td></tr><tr><td>why</td><td>kenapa</td></tr><tr><td>how</td><td>bagaimana</td></tr><tr><td>how much</td><td>berapa (harga/banyaknya)</td></tr></table></div>`,
ex:[['Where do you work?','Kamu kerja di mana?'],['What time is it?','Jam berapa sekarang?'],['How much is this?','Ini berapa harganya?']],
q:[{p:'<q>Where ___ you live?</q>',o:['do','does','are','is'],a:0,e:'Live adalah kata kerja, pelaku you: do.'},
{p:'<q>___ is your name?</q>',o:['What','Who','Where','How'],a:0,e:'Menanyakan nama: What is your name?'},
{p:'<q>Where ___ the toilet?</q>',o:['is','do','does','are'],a:0,e:'Tidak ada kata kerja lain, toilet tunggal: is.'}]},
{id:8,lvl:'A1',t:'In, On, At',s:'Preposisi tempat dan waktu',
body:`<p>Tiga kata kecil ini sering tertukar. Pikirkan dari yang paling luas ke paling sempit.</p>
<div class="formula"><b>Waktu</b><br>in → bulan, tahun, pagi/siang: in May, in 2026, in the morning<br>on → hari & tanggal: on Monday, on 17 August<br>at → jam: at seven, at night<br><br><b>Tempat</b><br>in → di dalam: in the room, in Bandung<br>on → di atas permukaan: on the shelf<br>at → di titik/lokasi: at the shop, at home</div>`,
ex:[['The shop opens at seven.','Toko buka jam tujuh.'],['I was born in 2001.','Saya lahir tahun 2001.'],['Put it on the shelf.','Taruh di rak.'],['She is at home.','Dia di rumah.']],
q:[{p:'<q>I wake up ___ six o’clock.</q>',o:['at','in','on','to'],a:0,e:'Jam memakai at.'},
{p:'<q>We are closed ___ Sunday.</q>',o:['on','in','at','by'],a:0,e:'Nama hari memakai on.'},
{p:'<q>I live ___ Bandung.</q>',o:['in','on','at','to'],a:0,e:'Kota memakai in.'}]},
{id:9,lvl:'A2',t:'Past Simple',s:'Cerita kejadian kemarin',
body:`<p>Untuk kejadian yang sudah selesai di masa lalu: yesterday, last week, two days ago.</p>
<div class="formula">Beraturan: kata kerja + <b>-ed</b> → work → worked, cook → cooked<br>Tidak beraturan (wajib hafal):<br>go → <b>went</b> · eat → <b>ate</b> · buy → <b>bought</b> · see → <b>saw</b><br>have → <b>had</b> · make → <b>made</b> · come → <b>came</b> · be → <b>was/were</b><br><br>Negatif: I <b>didn’t</b> go · Tanya: <b>Did</b> you eat?</div>
<p class="tip">Sama seperti does: setelah didn’t / did, kata kerja kembali polos. Did you <b>eat</b>? (bukan ate)</p>`,
ex:[['I went to the market yesterday.','Kemarin saya pergi ke pasar.'],['She bought two eggs.','Dia membeli dua telur.'],['We didn’t open last Sunday.','Minggu lalu kami tidak buka.'],['Did you eat?','Kamu sudah makan?']],
q:[{p:'<q>Yesterday I ___ to the shop.</q>',o:['went','go','goed','going'],a:0,e:'Go tidak beraturan: went.'},
{p:'<q>Did you ___ breakfast?</q>',o:['eat','ate','eaten','eats'],a:0,e:'Setelah did, kata kerja polos: eat.'},
{p:'Bentuk lampau dari <q>buy</q>:',o:['bought','buyed','buied','brought'],a:0,e:'Buy → bought. Hati-hati, brought itu lampau dari bring.'},
{p:'<q>They ___ at home last night.</q>',o:['were','was','are','did'],a:0,e:'They + lampau to be: were.'}]},
{id:10,lvl:'A2',t:'Masa Depan: will & going to',s:'Rencana dan janji',
body:`<p>Ada dua cara umum membicarakan masa depan.</p>
<div class="formula"><b>will</b> + kata kerja → keputusan spontan, janji, tebakan<br>I will help you. · It will rain.<br><br><b>am/is/are going to</b> + kata kerja → rencana yang sudah dipikirkan<br>I am going to study tonight.<br><br>Negatif: won’t (= will not) · I’m not going to</div>`,
ex:[['I will call you later.','Nanti saya telepon.'],['We are going to open a new shop.','Kami akan buka toko baru (sudah direncanakan).'],['I won’t be late.','Saya tidak akan terlambat.']],
q:[{p:'<q>The phone is ringing. I ___ answer it.</q> (keputusan spontan)',o:['will','am going to','going','am'],a:0,e:'Keputusan saat itu juga: will.'},
{p:'<q>She ___ visit her mother next week.</q> (sudah direncanakan)',o:['is going to','are going to','going to','will to'],a:0,e:'Rencana: is going to.'},
{p:'<q>won’t</q> artinya…',o:['will not','want not','was not','would'],a:0,e:'Won’t = will not.'}]},
{id:11,lvl:'A2',t:'Can, Must, Should',s:'Bisa, harus, sebaiknya',
body:`<p>Kata bantu ini selalu diikuti kata kerja polos dan tidak pernah ditambah -s.</p>
<div class="formula"><b>can</b> = bisa / boleh → I can speak English.<br><b>must</b> = harus → You must pay first.<br><b>should</b> = sebaiknya → You should rest.<br><br>Negatif: can’t · mustn’t (dilarang) · shouldn’t<br>Tanya: <b>Can</b> I help you?</div>
<p class="tip">He can <b>speak</b>, bukan he cans speaks.</p>`,
ex:[['Can I help you?','Ada yang bisa saya bantu?'],['You must wear a mask.','Kamu harus pakai masker.'],['You should drink more water.','Sebaiknya kamu minum lebih banyak air.']],
q:[{p:'<q>She ___ speak English.</q>',o:['can','cans','can to','is can'],a:0,e:'Can tidak berubah dan langsung diikuti kata kerja polos.'},
{p:'Kalimat menawarkan bantuan ke pelanggan:',o:['Can I help you?','Do I help you?','I can help you?','Must I help you?'],a:0,e:'Can I help you? adalah sapaan standar di toko.'},
{p:'<q>You look tired. You ___ rest.</q>',o:['should','mustn’t','can’t','will not'],a:0,e:'Saran: should.'}]},
{id:12,lvl:'A2',t:'Membandingkan',s:'Lebih murah, paling mahal',
body:`<p>Untuk membandingkan dua atau lebih benda.</p>
<div class="formula">Kata pendek: + <b>-er</b> / + <b>-est</b><br>cheap → cheaper → the cheapest<br>big → bigger → the biggest<br><br>Kata panjang: <b>more</b> / <b>the most</b><br>expensive → more expensive → the most expensive<br><br>Tidak beraturan: good → better → the best · bad → worse → the worst<br>Pembanding: <b>than</b> → This is cheaper <b>than</b> that.</div>`,
ex:[['This bag is cheaper than that one.','Tas ini lebih murah dari yang itu.'],['It is the best coffee in town.','Ini kopi terbaik di kota.'],['English is easier than I thought.','Bahasa Inggris lebih mudah dari yang saya kira.']],
q:[{p:'<q>This phone is ___ than that one.</q> (lebih mahal)',o:['more expensive','expensiver','most expensive','expensive'],a:0,e:'Kata panjang memakai more.'},
{p:'Bentuk "paling baik":',o:['the best','the goodest','the better','the most good'],a:0,e:'Good tidak beraturan: the best.'},
{p:'<q>Rice is cheaper ___ bread here.</q>',o:['than','then','that','from'],a:0,e:'Pembanding memakai than.'}]},
{id:13,lvl:'A2',t:'Present Perfect',s:'Sudah pernah, sudah selesai',
body:`<p>Menghubungkan masa lalu dengan sekarang: pengalaman (pernah), sesuatu yang baru saja selesai, atau keadaan yang berlangsung sampai sekarang.</p>
<div class="formula">pelaku + <b>have / has</b> + kata kerja bentuk ke-3 (V3)<br>I have eaten · She has finished<br><br>Negatif: I <b>haven’t</b> eaten · She <b>hasn’t</b> finished<br>Tanya: <b>Have</b> you ever been to Bali?<br><br>Kata yang sering menyertai: ever, never, already, yet, just, since, for</div>
<div class="tblwrap"><table class="mini"><tr><th>V1</th><th>V2 (lampau)</th><th>V3</th></tr>
<tr><td>go</td><td>went</td><td>gone</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td></tr><tr><td>see</td><td>saw</td><td>seen</td></tr><tr><td>do</td><td>did</td><td>done</td></tr><tr><td>be</td><td>was/were</td><td>been</td></tr><tr><td>buy</td><td>bought</td><td>bought</td></tr><tr><td>work</td><td>worked</td><td>worked</td></tr></table></div>
<p class="tip">Kalau waktunya disebut jelas (yesterday, last week), pakai past simple. I <b>went</b> yesterday, bukan I have gone yesterday.</p>`,
ex:[['I have worked here for two years.','Saya sudah bekerja di sini selama dua tahun.'],['Have you ever been to Jakarta?','Kamu pernah ke Jakarta?'],['She has just arrived.','Dia baru saja tiba.'],['I haven’t finished yet.','Saya belum selesai.']],
q:[{p:'<q>I ___ this movie before.</q>',o:['have seen','have saw','has seen','seen'],a:0,e:'I + have + V3 (seen).'},
{p:'<q>___ she finished the report?</q>',o:['Has','Have','Did','Is'],a:0,e:'She memakai has.'},
{p:'Pilih yang benar:',o:['I went to Bali last year.','I have gone to Bali last year.','I have went to Bali last year.','I go to Bali last year.'],a:0,e:'Ada waktu jelas (last year), jadi pakai past simple.'}]},
{id:14,lvl:'A2',t:'Past Continuous',s:'Sedang terjadi di masa lalu',
body:`<p>Untuk kegiatan yang sedang berlangsung pada waktu tertentu di masa lalu, sering saat ada kejadian lain menyela.</p>
<div class="formula">pelaku + <b>was / were</b> + kata kerja<b>-ing</b><br>I / he / she / it → was · you / we / they → were<br><br>I <b>was cooking</b> when the phone <b>rang</b>.<br>(sedang masak) ··· (tiba-tiba telepon bunyi)<br><br>Negatif: wasn’t / weren’t · Tanya: <b>Were</b> you sleeping?</div>`,
ex:[['I was sleeping at ten last night.','Jam sepuluh semalam saya sedang tidur.'],['They were working when the light went out.','Mereka sedang bekerja saat lampu mati.'],['What were you doing?','Kamu sedang apa tadi?']],
q:[{p:'<q>She ___ TV when I came.</q>',o:['was watching','were watching','is watching','watched'],a:0,e:'She + was + -ing.'},
{p:'<q>We ___ dinner at eight.</q> (sedang makan, kemarin)',o:['were having','was having','are having','have'],a:0,e:'We + were + -ing.'},
{p:'<q>I was walking home when it ___ to rain.</q>',o:['started','was starting','starts','start'],a:0,e:'Kejadian yang menyela memakai past simple.'}]},
{id:15,lvl:'A2',t:'Much, Many, Some, Any',s:'Benda yang bisa dan tidak bisa dihitung',
body:`<p>Bahasa Inggris membedakan benda yang bisa dihitung (egg, bottle) dan yang tidak (water, sugar, money, time).</p>
<div class="formula"><b>many</b> + benda bisa dihitung (jamak): many eggs<br><b>much</b> + benda tak bisa dihitung: much water<br><b>a lot of</b> → untuk keduanya: a lot of eggs, a lot of water<br><br><b>some</b> → kalimat positif: I have some money.<br><b>any</b> → negatif & pertanyaan: Do you have any sugar? I don’t have any.<br><br>Bertanya jumlah: <b>How many</b> bottles? · <b>How much</b> sugar?</div>
<p class="tip">Menawarkan sesuatu tetap pakai some: Would you like some tea?</p>`,
ex:[['How many eggs do you need?','Butuh berapa telur?'],['How much milk is left?','Susunya sisa berapa?'],['We don’t have any bread.','Kami tidak punya roti sama sekali.']],
q:[{p:'<q>How ___ bottles do you want?</q>',o:['many','much','some','any'],a:0,e:'Bottles bisa dihitung: many.'},
{p:'<q>I don’t have ___ money.</q>',o:['much','many','a','some'],a:0,e:'Money tidak bisa dihitung dan kalimatnya negatif: much.'},
{p:'<q>Do you have ___ eggs?</q>',o:['any','some','much','a'],a:0,e:'Pertanyaan memakai any.'}]},
{id:16,lvl:'A2',t:'Kata Sambung untuk Bercerita',s:'First, then, so, although',
body:`<p>Supaya ceritamu mengalir, sambungkan kalimat dengan kata yang tepat.</p>
<div class="formula"><b>Urutan:</b> first → then → after that → finally<br><b>Sebab-akibat:</b> because (karena) · so (jadi)<br><b>Pertentangan:</b> but (tapi) · although (meskipun) · however (namun)<br><b>Waktu:</b> when (ketika) · before · after · while</div>
<p class="tip">because diikuti sebab, so diikuti akibat. I was tired <b>because</b> I worked late. I worked late, <b>so</b> I was tired.</p>`,
ex:[['First, open the box. Then, check the items.','Pertama, buka kardusnya. Lalu, cek barangnya.'],['It was raining, so we stayed inside.','Hujan, jadi kami di dalam.'],['Although he was tired, he finished the work.','Meskipun capek, dia menyelesaikan pekerjaannya.']],
q:[{p:'<q>I was hungry, ___ I bought some bread.</q>',o:['so','because','although','but'],a:0,e:'Akibat: so.'},
{p:'<q>___ it was expensive, she bought it.</q>',o:['Although','Because','So','Then'],a:0,e:'Pertentangan: although.'},
{p:'<q>I stayed home ___ I was sick.</q>',o:['because','so','but','then'],a:0,e:'Alasan: because.'}]},
{id:17,lvl:'B1',t:'Kata Kerja + -ing atau + to',s:'Enjoy doing, want to do',
body:`<p>Kalau dua kata kerja bertemu, kata kerja kedua bentuknya ditentukan oleh kata kerja pertama. Ini harus dihafal per kata.</p>
<div class="formula">+ <b>-ing</b>: enjoy, finish, stop, mind, keep, avoid<br>I enjoy <b>reading</b>. · Stop <b>talking</b>.<br><br>+ <b>to</b>: want, need, hope, decide, plan, learn, try<br>I want <b>to go</b>. · She decided <b>to stay</b>.<br><br>Setelah preposisi (about, of, in, at) → selalu -ing<br>I am good at <b>cooking</b>. · Thank you for <b>helping</b>.</div>`,
ex:[['I enjoy learning English.','Saya menikmati belajar bahasa Inggris.'],['I want to open my own shop.','Saya ingin membuka toko sendiri.'],['Thank you for waiting.','Terima kasih sudah menunggu.']],
q:[{p:'<q>I enjoy ___ to music.</q>',o:['listening','to listen','listen','listened'],a:0,e:'Enjoy + -ing.'},
{p:'<q>She wants ___ a new phone.</q>',o:['to buy','buying','buy','bought'],a:0,e:'Want + to.'},
{p:'<q>Thank you for ___ me.</q>',o:['helping','to help','help','helped'],a:0,e:'Setelah preposisi for: -ing.'}]},
{id:18,lvl:'B1',t:'Kalimat If (Pengandaian)',s:'Kalau begini, maka begitu',
body:`<p>Ada tiga pola if yang paling sering dipakai.</p>
<div class="formula"><b>Fakta umum</b>: If + present, present<br>If you heat ice, it melts.<br><br><b>Kemungkinan nyata (masa depan)</b>: If + present, will + V1<br>If it rains, I <b>will</b> stay home.<br><br><b>Khayalan / tidak nyata</b>: If + past, would + V1<br>If I <b>had</b> money, I <b>would</b> buy a car.<br>If I <b>were</b> you, I <b>would</b> rest.</div>
<p class="tip">Bagian if tidak pakai will. If it <b>rains</b>, bukan If it will rain.</p>`,
ex:[['If you buy two, you get one free.','Kalau beli dua, gratis satu.'],['If I finish early, I will call you.','Kalau saya selesai cepat, saya telepon kamu.'],['If I were rich, I would travel.','Kalau saya kaya, saya akan jalan-jalan.']],
q:[{p:'<q>If it ___ tomorrow, we will close early.</q>',o:['rains','will rain','rained','raining'],a:0,e:'Bagian if memakai present: rains.'},
{p:'<q>If I had time, I ___ learn French.</q>',o:['would','will','can','am'],a:0,e:'Khayalan: if + past, would.'},
{p:'<q>If I ___ you, I would see a doctor.</q>',o:['were','am','was be','will be'],a:0,e:'Pola khayalan baku: If I were you.'}]},
{id:19,lvl:'B1',t:'Kalimat Pasif',s:'Dibuat, dijual, dikirim',
body:`<p>Kalimat pasif fokus pada benda yang dikenai pekerjaan, bukan pelakunya. Mirip awalan "di-".</p>
<div class="formula">benda + <b>to be</b> + V3<br>Sekarang: The shop <b>is opened</b> at seven. (dibuka)<br>Lampau: The milk <b>was delivered</b> yesterday. (diantar)<br>Masa depan: It <b>will be sent</b> tomorrow. (akan dikirim)<br><br>Pelaku disebut dengan <b>by</b>: This cake was made <b>by</b> my mother.</div>`,
ex:[['Rice is sold here.','Beras dijual di sini.'],['The items were checked this morning.','Barang-barangnya sudah dicek tadi pagi.'],['English is spoken in many countries.','Bahasa Inggris dipakai di banyak negara.']],
q:[{p:'<q>This bag ___ in Bandung.</q> (dibuat)',o:['is made','makes','is make','made is'],a:0,e:'Pasif sekarang: is + V3 (made).'},
{p:'<q>The boxes ___ yesterday.</q> (diantar)',o:['were delivered','was delivered','are delivered','delivered'],a:0,e:'Boxes jamak, lampau: were + V3.'},
{p:'<q>The book was written ___ a teacher.</q>',o:['by','from','with','of'],a:0,e:'Pelaku dalam pasif memakai by.'}]},
{id:20,lvl:'B1',t:'Who, Which, That',s:'Yang (menjelaskan orang dan benda)',
body:`<p>Dipakai untuk menambah keterangan, seperti kata "yang".</p>
<div class="formula"><b>who</b> → untuk orang: The man <b>who</b> works here is kind.<br><b>which</b> → untuk benda: The bag <b>which</b> I bought is red.<br><b>that</b> → orang atau benda (santai): The milk <b>that</b> you want is sold out.<br><b>where</b> → tempat: This is the shop <b>where</b> I work.</div>`,
ex:[['She is the customer who came yesterday.','Dia pelanggan yang datang kemarin.'],['This is the phone that I lost.','Ini HP yang saya hilangkan.'],['That is the market where we buy vegetables.','Itu pasar tempat kami beli sayur.']],
q:[{p:'<q>The woman ___ lives next door is a nurse.</q>',o:['who','which','where','what'],a:0,e:'Orang: who.'},
{p:'<q>I like the shirt ___ you bought.</q>',o:['which','who','where','when'],a:0,e:'Benda: which (atau that).'},
{p:'<q>This is the city ___ I was born.</q>',o:['where','which','who','that'],a:0,e:'Tempat: where.'}]},
{id:21,lvl:'B1',t:'Kalimat Tidak Langsung',s:'He said that…',
body:`<p>Untuk menyampaikan ucapan orang lain. Biasanya waktunya mundur satu langkah.</p>
<div class="formula">"I <b>am</b> tired." → He said (that) he <b>was</b> tired.<br>"I <b>will</b> come." → She said she <b>would</b> come.<br>"I <b>like</b> it." → He said he <b>liked</b> it.<br><br>Perintah: "Wait!" → He told me <b>to wait</b>.<br>Pertanyaan: "Where do you live?" → She asked me where I <b>lived</b>.</div>
<p class="tip">said tidak diikuti orang (He said that…). told diikuti orang (He told <b>me</b> that…).</p>`,
ex:[['The boss said that we would close early.','Bos bilang kita akan tutup lebih awal.'],['She told me to wait outside.','Dia menyuruhku menunggu di luar.'],['He asked me what my name was.','Dia bertanya siapa namaku.']],
q:[{p:'"I am busy." → <q>She said she ___ busy.</q>',o:['was','is','be','were'],a:0,e:'Am mundur menjadi was.'},
{p:'"Close the door." → <q>He told me ___ the door.</q>',o:['to close','close','closing','closed'],a:0,e:'Perintah: told + orang + to.'},
{p:'<q>He ___ me that the price had changed.</q>',o:['told','said','spoke','talked'],a:0,e:'Diikuti orang (me): told.'}]},
{id:22,lvl:'B1',t:'Phrasal Verbs Sehari-hari',s:'Turn on, pick up, look for',
body:`<p>Phrasal verb adalah kata kerja + kata kecil yang artinya berubah. Sangat sering dipakai dalam percakapan.</p>
<div class="tblwrap"><table class="mini"><tr><th>Phrasal verb</th><th>Arti</th></tr>
<tr><td>turn on / turn off</td><td>menyalakan / mematikan</td></tr><tr><td>pick up</td><td>mengambil / menjemput / mengangkat telepon</td></tr><tr><td>look for</td><td>mencari</td></tr><tr><td>find out</td><td>mencari tahu</td></tr><tr><td>give up</td><td>menyerah</td></tr><tr><td>run out of</td><td>kehabisan</td></tr><tr><td>come back</td><td>kembali</td></tr><tr><td>get up</td><td>bangun dari tempat tidur</td></tr><tr><td>fill in</td><td>mengisi (formulir)</td></tr><tr><td>check out</td><td>membayar dan pergi / melihat-lihat</td></tr></table></div>
<p class="tip">Jangan terjemahkan per kata. "Give up" bukan "memberi ke atas", tapi menyerah.</p>`,
ex:[['We have run out of sugar.','Gula kami habis.'],['I am looking for the soap.','Saya sedang mencari sabun.'],['Please turn off the light.','Tolong matikan lampunya.'],['Don’t give up!','Jangan menyerah!']],
q:[{p:'<q>Can you ___ the fan? It is hot.</q>',o:['turn on','turn off','give up','look for'],a:0,e:'Panas, jadi kipasnya dinyalakan: turn on.'},
{p:'<q>We have ___ milk. Order more.</q>',o:['run out of','picked up','found out','come back'],a:0,e:'Kehabisan: run out of.'},
{p:'<q>Excuse me, I am ___ the toilet.</q>',o:['looking for','looking at','finding out','getting up'],a:0,e:'Mencari: look for.'}]}
];

{id:3,lvl:'A2',t:'Minggu yang Hujan',en:"Last Sunday, I wanted to go to the park with my friends. But in the morning, it started to rain. It rained very hard, so we stayed at home. First, we made some hot tea. Then, we watched a funny movie. After that, my friend cooked noodles for everyone. In the afternoon, the rain stopped. We went outside and walked around the village. The air was fresh and cool. It was not the day we planned, but it was a good day.",

{id:6,lvl:'B1',t:'Musim Ramai',en:"December has always been the busiest month at the shop. This year, more customers have come than ever before. Hundreds of boxes are delivered every week, and the shelves are refilled three times a day. The manager has hired two new staff members to help. Although everyone is tired, the team works well together. Sales have increased by thirty percent. At the end of the month, every worker will be given a bonus as a thank-you.",

(function(){const have=new Set(VOCAB.map(v=>v.w+'|'+v.a));let cat='';RAW2.trim().split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){cat=l.slice(1).trim();return}const p=l.split('|');if(have.has(p[0]+'|'+p[1]))return;VOCAB.push({id:VOCAB.length,w:p[0],a:p[1],b:p[2],ex:p[3],exa:p[4],cat})})})();

CH.push(
{id:23,lvl:'B1',t:'Too, Enough, So, Such',s:'Terlalu, cukup, begitu',
body:`<p>Empat kata ini mengatur tingkat: kelebihan, kecukupan, dan penekanan.</p>
<div class="formula"><b>too</b> + kata sifat → terlalu (masalah): It is <b>too</b> expensive.<br>kata sifat + <b>enough</b> → cukup: It is big <b>enough</b>.<br><b>enough</b> + kata benda: I have <b>enough</b> money.<br><br><b>so</b> + kata sifat: The food is <b>so</b> good!<br><b>such</b> + (a) + kata sifat + benda: It is <b>such a</b> good shop!<br><br>so … that …: I was <b>so</b> tired <b>that</b> I slept at eight.</div>
<p class="tip">too bukan very. "Very hot" = sangat panas. "Too hot" = terlalu panas, sampai jadi masalah.</p>`,
ex:[["This bag is too heavy for me.","Tas ini terlalu berat untukku."],["Is the room big enough?","Apakah ruangannya cukup besar?"],["It was such a busy day.","Hari yang begitu sibuk."],["He spoke so fast that I couldn't follow.","Dia bicara begitu cepat sampai saya tidak bisa mengikuti."]],
q:[{p:'<q>I can’t buy it. It is ___ expensive.</q>',o:['too','enough','such','so much'],a:0,e:'Terlalu mahal sampai tidak bisa beli: too.'},
{p:'<q>He is not old ___ to drive.</q>',o:['enough','too','such','so'],a:0,e:'Kata sifat + enough.'},
{p:'<q>It was ___ a good movie!</q>',o:['such','so','too','enough'],a:0,e:'Such + a + kata sifat + benda.'}]},
{id:24,lvl:'B1',t:'Used to',s:'Dulu biasa, sekarang tidak',
body:`<p>Untuk kebiasaan atau keadaan di masa lalu yang sekarang sudah berubah.</p>
<div class="formula">pelaku + <b>used to</b> + kata kerja polos<br>I <b>used to</b> walk to school. (dulu jalan kaki, sekarang tidak)<br><br>Negatif: I <b>didn’t use to</b> like coffee.<br>Tanya: <b>Did</b> you <b>use to</b> live here?<br><br>Jangan tertukar: <b>be used to</b> + -ing = sudah terbiasa<br>I <b>am used to</b> waking up early.</div>`,
ex:[["I used to work in a factory.","Dulu saya kerja di pabrik."],["She didn’t use to speak English.","Dulu dia tidak bisa bahasa Inggris."],["I am used to the night shift now.","Sekarang saya sudah terbiasa shift malam."]],
q:[{p:'<q>I ___ live in Surabaya, but now I live in Bandung.</q>',o:['used to','use to','am used to','was use'],a:0,e:'Kebiasaan lampau: used to.'},
{p:'<q>Did you ___ play football?</q>',o:['use to','used to','using to','uses to'],a:0,e:'Setelah did, kembali ke use to.'},
{p:'<q>I am used to ___ early.</q>',o:['waking up','wake up','woke up','wakes up'],a:0,e:'Be used to + -ing.'}]},
{id:25,lvl:'B1',t:'Might, May, Could',s:'Mungkin, bisa jadi',
body:`<p>Dipakai saat kamu tidak yakin 100%.</p>
<div class="formula"><b>will</b> → yakin: It will rain.<br><b>may / might / could</b> + kata kerja polos → mungkin: It <b>might</b> rain.<br><b>must</b> → hampir pasti (kesimpulan): He <b>must</b> be tired.<br><b>can’t</b> → hampir pasti tidak: That <b>can’t</b> be right.<br><br>Negatif: might not / may not</div>
<p class="tip">May juga dipakai untuk izin yang sopan: <b>May I</b> come in?</p>`,
ex:[["I might be late tomorrow.","Besok saya mungkin terlambat."],["She may not come today.","Dia mungkin tidak datang hari ini."],["You must be hungry after work.","Kamu pasti lapar sehabis kerja."],["May I see your receipt?","Boleh saya lihat struk Anda?"]],
q:[{p:'<q>Take an umbrella. It ___ rain.</q>',o:['might','must to','can’t','is'],a:0,e:'Mungkin hujan: might.'},
{p:'<q>He worked twelve hours. He ___ be tired.</q>',o:['must','might not','can’t','may to'],a:0,e:'Kesimpulan hampir pasti: must.'},
{p:'Cara sopan meminta izin:',o:['May I come in?','I may come in?','Might come I in?','Must I come?'],a:0,e:'May I + kata kerja.'}]},
{id:26,lvl:'B1',t:'Present Perfect Continuous',s:'Sudah sekian lama dan masih berlangsung',
body:`<p>Menekankan lamanya kegiatan yang dimulai di masa lalu dan masih berlangsung sampai sekarang.</p>
<div class="formula">pelaku + <b>have / has been</b> + kata kerja<b>-ing</b><br>I <b>have been learning</b> English for two months.<br>She <b>has been waiting</b> since nine.<br><br><b>for</b> + lamanya: for two hours, for a year<br><b>since</b> + titik mulai: since Monday, since 2020<br><br>Tanya: <b>How long</b> have you been working here?</div>`,
ex:[["I have been waiting for an hour.","Saya sudah menunggu selama satu jam."],["How long have you been learning English?","Sudah berapa lama kamu belajar bahasa Inggris?"],["It has been raining since morning.","Sudah hujan sejak pagi."]],
q:[{p:'<q>I ___ here for three years.</q>',o:['have been working','am working','have been work','was work'],a:0,e:'Have been + -ing.'},
{p:'<q>She has been waiting ___ nine o’clock.</q>',o:['since','for','from','at'],a:0,e:'Titik mulai: since.'},
{p:'<q>How long ___ you been living here?</q>',o:['have','are','did','do'],a:0,e:'How long have you been …?'}]},
{id:27,lvl:'B1',t:'Wish & Penyesalan',s:'Seandainya…',
body:`<p>Untuk mengungkapkan keinginan yang tidak sesuai kenyataan, atau menyesali masa lalu.</p>
<div class="formula">Keinginan sekarang: <b>I wish</b> + past simple<br>I wish I <b>had</b> more time. (kenyataannya tidak punya)<br><br>Menyesali masa lalu: <b>I wish</b> + had + V3<br>I wish I <b>had studied</b> harder.<br><br>Pengandaian masa lalu: If + had + V3, would have + V3<br>If I <b>had known</b>, I <b>would have come</b>.<br><br>Seharusnya: <b>should have</b> + V3 → I should have called you.</div>`,
ex:[["I wish I could speak English fluently.","Seandainya saya bisa bahasa Inggris dengan lancar."],["I should have checked the date.","Seharusnya saya mengecek tanggalnya."],["If we had left earlier, we would have caught the bus.","Kalau kita berangkat lebih awal, kita pasti dapat busnya."]],
q:[{p:'<q>I wish I ___ a bigger shop.</q>',o:['had','have','will have','am having'],a:0,e:'Wish + past simple.'},
{p:'<q>I ___ have called you. Sorry.</q>',o:['should','wish','would to','must to'],a:0,e:'Should have + V3 = seharusnya.'},
{p:'<q>If I had known, I ___ have helped.</q>',o:['would','will','had','am'],a:0,e:'If + had V3, would have V3.'}]},
{id:28,lvl:'B1',t:'Bicara Sopan & Basa-basi',s:'Could you, would you mind, isn’t it?',
body:`<p>Bahasa Inggris yang sopan memakai kalimat tidak langsung. Ini penting saat melayani orang.</p>
<div class="formula">Meminta: <b>Could you</b> help me? · <b>Would you mind</b> waiting?<br>Menawarkan: <b>Would you like</b> a bag? · <b>Shall I</b> carry it?<br>Izin: <b>Do you mind if</b> I sit here?<br>Melunakkan: <b>I’m afraid</b> we are closed. (sayangnya)<br><br>Question tag (basa-basi): It’s hot today, <b>isn’t it?</b><br>You work here, <b>don’t you?</b></div>
<p class="tip">Would you mind diikuti -ing. Jawaban "No, not at all" artinya tidak keberatan (boleh).</p>`,
ex:[["Would you mind waiting a moment?","Keberatan menunggu sebentar?"],["I’m afraid that item is sold out.","Sayangnya barang itu sudah habis."],["It’s a nice day, isn’t it?","Hari yang cerah, ya?"],["Would you like some help?","Mau dibantu?"]],
q:[{p:'<q>Would you mind ___ the door?</q>',o:['closing','close','to close','closed'],a:0,e:'Would you mind + -ing.'},
{p:'Cara halus bilang barang habis:',o:['I’m afraid it is sold out.','No. Finished.','It is not.','You can’t.'],a:0,e:'I’m afraid… melunakkan kabar kurang enak.'},
{p:'<q>It’s cold today, ___?</q>',o:['isn’t it','is it','doesn’t it','aren’t you'],a:0,e:'Kalimat positif dengan is → tag negatif: isn’t it.'}]},
{id:29,lvl:'A2',t:'Kata Kerja Tak Beraturan',s:'Tabel hafalan V1, V2, V3',
body:`<p>Sebagian besar kata kerja lampau cukup ditambah -ed. Yang di bawah ini berubah bentuk dan harus dihafal. V2 untuk past simple, V3 untuk perfect dan pasif.</p>
<div class="tblwrap"><table class="mini"><tr><th>V1</th><th>V2</th><th>V3</th><th>Arti</th></tr>
<tr><td>be</td><td>was / were</td><td>been</td><td>adalah / berada</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>pergi</td></tr><tr><td>do</td><td>did</td><td>done</td><td>melakukan</td></tr><tr><td>have</td><td>had</td><td>had</td><td>punya</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td><td>makan</td></tr><tr><td>drink</td><td>drank</td><td>drunk</td><td>minum</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>melihat</td></tr><tr><td>give</td><td>gave</td><td>given</td><td>memberi</td></tr><tr><td>take</td><td>took</td><td>taken</td><td>mengambil</td></tr><tr><td>come</td><td>came</td><td>come</td><td>datang</td></tr><tr><td>make</td><td>made</td><td>made</td><td>membuat</td></tr><tr><td>buy</td><td>bought</td><td>bought</td><td>membeli</td></tr><tr><td>sell</td><td>sold</td><td>sold</td><td>menjual</td></tr><tr><td>pay</td><td>paid</td><td>paid</td><td>membayar</td></tr><tr><td>say</td><td>said</td><td>said</td><td>berkata</td></tr><tr><td>tell</td><td>told</td><td>told</td><td>memberi tahu</td></tr><tr><td>know</td><td>knew</td><td>known</td><td>tahu</td></tr><tr><td>think</td><td>thought</td><td>thought</td><td>berpikir</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>menulis</td></tr><tr><td>speak</td><td>spoke</td><td>spoken</td><td>berbicara</td></tr><tr><td>find</td><td>found</td><td>found</td><td>menemukan</td></tr><tr><td>forget</td><td>forgot</td><td>forgotten</td><td>lupa</td></tr><tr><td>break</td><td>broke</td><td>broken</td><td>memecahkan</td></tr><tr><td>bring</td><td>brought</td><td>brought</td><td>membawa</td></tr></table></div>`,
ex:[["I have written the report.","Saya sudah menulis laporannya."],["The glass was broken.","Gelasnya pecah."],["She has spoken to the manager.","Dia sudah bicara dengan manajer."]],
q:[{p:'V3 dari <q>write</q>:',o:['written','wrote','writed','writing'],a:0,e:'write, wrote, written.'},
{p:'<q>I have never ___ this fruit.</q>',o:['eaten','ate','eat','eating'],a:0,e:'Have + V3: eaten.'},
{p:'V2 dari <q>speak</q>:',o:['spoke','spoken','speaked','spoked'],a:0,e:'speak, spoke, spoken.'},
{p:'<q>The window was ___ yesterday.</q>',o:['broken','broke','break','breaking'],a:0,e:'Pasif: was + V3 (broken).'}]}
);

const PER_DAY=10;
const KEY='inggris-dari-nol-v1';
function blank(){return{next:0,batches:[],cards:{},days:[],active:[],chapters:{},dialogs:{},stories:{},practice:{},rate:0.9}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign(blank(),o)}}catch(e){}return blank()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}chipStreak()}

const pad=n=>String(n).padStart(2,'0');
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return keyOf(new Date())}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);return keyOf(new Date(y,m-1,d+n,12))}
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function fmt(k){const [y,m,d]=k.split('-').map(Number);const x=new Date(y,m-1,d,12);return HARI[x.getDay()]+', '+d+' '+BULAN[m-1]}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const V=()=>$('#view');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();

/* ---------- aturan harian ---------- */
function lastBatch(){return S.batches[S.batches.length-1]}
/* learn: batch belum lulus tes · done: lulus HARI INI (besok wajib ujian ulang)
   review: lulus hari sebelumnya, belum lulus ujian ulang → kata baru terkunci · new: boleh ambil kata baru */
function dayState(){
  const t=today(),b=lastBatch();
  if(b&&!b.passed)return{k:'learn',b};
  if(b&&!b.reviewed)return b.passedDate===t?{k:'done',b}:{k:'review',b};
  if(S.next>=VOCAB.length)return{k:'finished',b};
  return{k:'new',b};
}
function activeSet(){return new Set([].concat(S.days,S.active))}
function touch(){const t=today();if(!S.active.includes(t))S.active.push(t);save()}
function streak(){const set=activeSet();let k=today();if(!set.has(k))k=addDays(k,-1);let n=0;while(set.has(k)){n++;k=addDays(k,-1)}return n}
function dueCards(){const t=today();return Object.keys(S.cards).filter(id=>S.cards[id].due<=t).map(Number)}
const learned=()=>Object.keys(S.cards).length;
const cnt=o=>Object.keys(o).length;
function stageDone(s){return s.ch.every(id=>S.chapters[id])&&s.dl.every(id=>S.dialogs[id])&&s.st.every(id=>S.stories[id])&&learned()>=s.words}
function level(){const s=STAGES.find(x=>!stageDone(x));return s?s.lvl:'B1+'}
function chipStreak(){const el=$('#streak');if(!el)return;const n=streak();el.innerHTML=I.flame+n+' hari';el.classList.toggle('on',activeSet().has(today()))}

/* ---------- suara ---------- */
const canSpeak=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
function utter(t,pitch,rate){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||S.rate||.9;u.pitch=pitch||1;return u}
function speak(t,rate){if(!canSpeak)return;try{speechSynthesis.cancel();speechSynthesis.speak(utter(t,1,rate))}catch(e){}}
function clearPlaying(){document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'))}
function speakSeq(items){if(!canSpeak)return;try{speechSynthesis.cancel();
  items.forEach((it,i)=>{const u=utter(it.t,it.pitch);u.onstart=()=>{clearPlaying();if(it.el)it.el.classList.add('playing')};if(i===items.length-1)u.onend=clearPlaying;speechSynthesis.speak(u)})}catch(e){}}
function stopSpeak(){if(canSpeak){try{speechSynthesis.cancel()}catch(e){}}clearPlaying()}
const spk=(t,label,bare)=>canSpeak?`<button class="spk ${bare?'bare':''}" data-say="${esc(t)}" aria-label="Dengar: ${esc(t)}">${I.speak}${label?`<span>${esc(label)}</span>`:''}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();speak(b.dataset.say)}
  const r=e.target.closest('[data-rate]');if(r){S.rate=+r.dataset.rate;save();document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x.dataset.rate===r.dataset.rate))}});
const rateCtl=()=>canSpeak?`<span class="rate" role="group" aria-label="Kecepatan suara"><span class="eyebrow">Suara</span><button class="${S.rate<.8?'on':''}" data-rate="0.65">Pelan</button><button class="${S.rate>=.8?'on':''}" data-rate="0.9">Normal</button></span>`:'<span class="note">Browser ini tidak mendukung suara. Coba buka di Chrome.</span>';
function sentences(t){return t.match(/[^.!?]+[.!?]+["”]?\s*/g)||[t]}

/* ---------- kartu ---------- */
function cardHTML(v){return`<div class="flip" tabindex="0" role="button" aria-label="Balik kartu">
  <div class="flip-in">
    <div class="face front"><span class="eyebrow tag">${esc(v.cat)}</span><div class="en word">${esc(v.w)}</div><div class="say">/ ${esc(v.b)} /</div>${spk(v.w,'Dengar')}<span class="hint">Ketuk kartu untuk lihat arti</span></div>
    <div class="face backf"><span class="eyebrow tag">${esc(v.cat)}</span><div class="en word sm"><span class="hl">${esc(v.w)}</span></div><div class="mean">${esc(v.a)}</div><p class="en ex">${esc(v.ex)}</p><p class="exa">${esc(v.exa)}</p><div class="row c">${spk(v.w,'Kata')}${spk(v.ex,'Kalimat')}</div></div>
  </div></div>`}
function wireFlip(host,onFlip){const c=host.querySelector('.flip');if(!c)return;const go=e=>{if(e.target.closest('[data-say]'))return;c.classList.toggle('on');if(onFlip)onFlip(c.classList.contains('on'))};
  c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}})}
function wrow(v,extra){return`<div>${spk(v.w,'',true)}<span class="w">${esc(v.w)}<small>/${esc(v.b)}/</small></span><span class="m">${esc(v.a)}${extra||''}</span></div>`}
function study(host,ids,o){
  let i=0;
  (function r(){
    const v=VOCAB[ids[i]],last=i===ids.length-1;
    host.innerHTML=`<div class="panel">
      <div class="qhead"><span class="eyebrow">${esc(o.title||'Hafalkan')}</span><span class="count">${i+1} / ${ids.length}</span></div>
      <div class="bar-p"><span style="width:${(i+1)/ids.length*100}%"></span></div>
      ${cardHTML(v)}
      <div class="cardnav"><button class="btn" id="prev" ${i===0?'disabled':''}>${I.back} Sebelumnya</button>
      ${last?`<button class="btn pri" id="end">${esc(o.endLabel||'Selesai')}</button>`:`<button class="btn pri" id="next">Berikutnya ${I.arrow}</button>`}</div>
      ${o.cancel?`<button class="btn ghost sm" id="cancel">Kembali</button>`:''}
    </div>`;
    wireFlip(host);
    host.querySelector('#prev').onclick=()=>{i--;r()};
    const n=host.querySelector('#next');if(n)n.onclick=()=>{i++;r()};
    const e=host.querySelector('#end');if(e)e.onclick=o.onEnd;
    const c=host.querySelector('#cancel');if(c)c.onclick=o.cancel;
  })();
}

/* ---------- kuis ---------- */
function vocabQs(ids){
  return shuffle(ids).map((id,n)=>{
    const v=VOCAB[id],toId=n%2===0;
    const pool=shuffle(VOCAB.filter(x=>x.id!==id&&x.a!==v.a&&x.w!==v.w));
    const same=pool.filter(x=>x.cat===v.cat),other=pool.filter(x=>x.cat!==v.cat);
    const picks=[],seen=new Set([toId?v.a:v.w]);
    for(const x of same.concat(other)){const val=toId?x.a:x.w;if(!seen.has(val)){seen.add(val);picks.push(val)}if(picks.length===3)break}
    const opts=shuffle([toId?v.a:v.w].concat(picks));
    return{p:toId?`Apa arti <q>${esc(v.w)}</q>?`:`Bahasa Inggrisnya "${esc(v.a)}"?`,o:opts,a:opts.indexOf(toId?v.a:v.w),e:`<span class="en"><b>${esc(v.w)}</b></span> = ${esc(v.a)}. <span class="en">${esc(v.ex)}</span>`,id,en:!toId};
  });
}
const mixQ=qs=>shuffle(qs).map(q=>{const order=shuffle(q.o.map((_,k)=>k));return{p:q.p,o:order.map(k=>q.o[k]),a:order.indexOf(q.a),e:esc(q.e)}});
function quiz(host,qs,o){
  let i=0;const wrong=[];
  function r(){
    if(i>=qs.length)return o.onDone(wrong,qs.length);
    const q=qs[i];
    host.innerHTML=`<div class="panel ${o.cls||''}">
      <div class="qhead"><span class="eyebrow">${esc(o.title)}</span><span class="count">${i+1} / ${qs.length}</span></div>
      <div class="bar-p"><span style="width:${i/qs.length*100}%"></span></div>
      <p class="q-prompt">${q.p}</p>
      <div class="opts">${q.o.map((x,k)=>`<button class="opt ${q.en?'en':''}" data-k="${k}">${esc(x)}</button>`).join('')}</div>
      <div id="fbslot"></div>
    </div>`;
    host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  }
  function pick(k){
    const q=qs[i],ok=k===q.a;
    host.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add('right');else if(n===k)b.classList.add('wrong')});
    if(!ok)wrong.push(q);
    host.querySelector('#fbslot').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Benar.':'Belum tepat.'}</b> ${q.e}</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="nx">${i===qs.length-1?'Lihat hasil':'Lanjut'} ${I.arrow}</button></div>`;
    const nx=host.querySelector('#nx');nx.focus({preventScroll:true});nx.onclick=()=>{i++;r()};
  }
  r();
}
function resultHTML(ok,score,total,msg,buttons,extra){return`<div class="panel ${ok?'':'warn'}"><div class="result"><span class="eyebrow">${ok?'Lulus':'Belum lulus'}</span><div class="big ${ok?'good':'bad'}">${score}/${total}</div><p class="lede">${msg}</p></div>${extra||''}<div class="row c">${buttons}</div></div>`}
const goTop=el=>{if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};

function renderToday(){
  const st=dayState(),t=today(),due=dueCards().length,now=new Date(),h=now.getHours();
  const greet=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  const nextCh=CH.find(c=>!S.chapters[c.id]),nextDl=DIALOGS.find(d=>!S.dialogs[d.id]),nextSt=STORIES.find(s=>!S.stories[s.id]);
  const did=o=>Object.values(o).includes(t);
  const reviewDone=S.batches.some(b=>b.reviewDate===t),wordsDone=S.batches.some(b=>b.passedDate===t);
  const n=st.b?st.b.ids.length:PER_DAY;
  const H={
    review:{e:'Wajib dulu',h:`Ujian ulang <mark>${n} kata</mark> kemarin.`,p:'Harus benar semua. Setelah lulus, kata baru terbuka.',c:'Mulai ujian ulang'},
    learn:{e:'Sedang berjalan',h:`Hafalkan <mark>${n} kata</mark> hari ini.`,p:'Baca, dengar, ucapkan. Lalu tes sampai benar semua.',c:'Lanjut hafalan'},

function renderTask(st){
  const host=$('#task'),t=today();
  if(st.k==='review'){
    const b=st.b;
    host.innerHTML=`<div class="panel warn">
      <span class="eyebrow">Wajib sebelum kata baru</span>
      <h2>Ujian ulang: ${b.ids.length} kata dari ${fmt(b.passedDate)}</h2>
      <p class="lede">Satu saja salah, pelajari lagi lalu ulangi. Kata baru terbuka setelah lulus.</p>
      <div class="chips">${b.ids.map(id=>`<span class="chip">${esc(VOCAB[id].w)}</span>`).join('')}</div>
      <div class="row"><button class="btn pri" id="go">Mulai ujian ulang</button><button class="btn" id="peek">Lihat kartunya dulu</button></div>
    </div>`;
    host.querySelector('#go').onclick=()=>runTest(b,'review');
    host.querySelector('#peek').onclick=()=>{study(host,b.ids,{title:'Pengingat sebelum ujian',endLabel:'Mulai ujian ulang',onEnd:()=>runTest(b,'review'),cancel:renderToday});goTop(host)};
    return;
  }
  if(st.k==='learn'){
    const b=st.b;
    host.innerHTML=`<div class="panel em">
      <span class="eyebrow">Kata baru · ${esc(VOCAB[b.ids[0]].cat)}</span>
      <h2>${b.ids.length} kata untuk dihafal</h2>
      <div class="wlist">${b.ids.map(id=>wrow(VOCAB[id])).join('')}</div>
      <div class="row"><button class="btn pri" id="st">Hafalkan pakai kartu</button><button class="btn" id="go">Saya siap tes</button></div>
    </div>`;
    host.querySelector('#st').onclick=()=>{study(host,b.ids,{title:'Hafalkan',endLabel:'Mulai tes',onEnd:()=>runTest(b,'learn'),cancel:renderToday});goTop(host)};
    host.querySelector('#go').onclick=()=>runTest(b,'learn');
    return;
  }
  if(st.k==='done'){
    const b=st.b;
    host.innerHTML=`<div class="panel">
      <span class="eyebrow">Diuji ulang besok</span>
      <div class="chips">${b.ids.map(id=>`<span class="chip">${esc(VOCAB[id].w)}</span>`).join('')}</div>
      <div class="row"><button class="btn sm" id="again">Latihan lagi kata hari ini</button></div>
    </div>`;
    host.querySelector('#again').onclick=()=>{study(host,shuffle(b.ids),{title:'Latihan bebas',endLabel:'Selesai',onEnd:renderToday,cancel:renderToday});goTop(host)};
    return;
  }
  if(st.k==='finished'){host.innerHTML='';return}
  const from=S.next+1,to=Math.min(S.next+PER_DAY,VOCAB.length);
  const cats=[...new Set(VOCAB.slice(S.next,to).map(v=>v.cat))];
  host.innerHTML=`<div class="panel em">
    <span class="eyebrow">Kata ke-${from} sampai ${to} dari ${VOCAB.length}</span>
    <h2>Topik: ${esc(cats.join(', '))}</h2>
    <div class="row"><button class="btn pri" id="take">Buka kata hari ini ${I.arrow}</button></div>
  </div>`;
  host.querySelector('#take').onclick=()=>{
    const ids=[];for(let i=S.next;i<to;i++)ids.push(i);
    S.batches.push({date:t,ids,passed:false,passedDate:null,reviewed:false,reviewDate:null});
    S.next=to;save();renderToday();goTop($('#task'));
  };
}
function runTest(b,mode){
  const host=$('#task');
  quiz(host,vocabQs(b.ids),{title:mode==='review'?'Ujian ulang':'Tes kata hari ini',cls:mode==='review'?'warn':'em',onDone:(wrong,total)=>{
    const t=today();
    if(!wrong.length){
      if(mode==='learn'){b.passed=true;b.passedDate=t;if(!S.days.includes(t))S.days.push(t);b.ids.forEach(id=>{S.cards[id]={box:1,due:addDays(t,1)}})}
      else{b.reviewed=true;b.reviewDate=t;b.ids.forEach(id=>{const c=S.cards[id]||{box:1};c.box=Math.max(c.box,2);c.due=addDays(t,3);S.cards[id]=c})}
      touch();
      host.innerHTML=resultHTML(true,total,total,mode==='review'?'Kata kemarin masih nempel. Kata baru sekarang terbuka.':'Semua benar. Besok kata-kata ini diuji ulang.',`<button class="btn pri" id="ok">${mode==='review'?'Lanjut ke kata baru':'Selesai'}</button>`);
      host.querySelector('#ok').onclick=()=>{renderToday();goTop(mode==='review'?$('#task'):V())};
    }else{
      host.innerHTML=resultHTML(false,total-wrong.length,total,`Harus ${total}/${total} untuk lanjut. Ini yang masih salah:`,
        `<button class="btn pri" id="re">Pelajari lagi, lalu ulangi</button><button class="btn" id="retry">Langsung ulangi tes</button>`,
        `<div class="wlist">${wrong.map(q=>wrow(VOCAB[q.id])).join('')}</div>`);
      const wid=wrong.map(q=>q.id);
      host.querySelector('#re').onclick=()=>{study(host,wid.concat(b.ids.filter(id=>!wid.includes(id))),{title:'Pelajari lagi',endLabel:'Ulangi tes',onEnd:()=>runTest(b,mode),cancel:renderToday});goTop(host)};
      host.querySelector('#retry').onclick=()=>runTest(b,mode);
    }
    goTop(host);
  }});
  goTop(host);
}
